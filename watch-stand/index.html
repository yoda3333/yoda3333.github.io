 strip:new THREE.MeshPhysicalMaterial({color:0xf0b86a,transparent:true,opacity:0.6,roughness:0.2,side:THREE.DoubleSide}),
 metal:new THREE.MeshStandardMaterial({color:0x555555,roughness:0.4,metalness:0.7}),
 watch:new THREE.MeshStandardMaterial({color:0x2b4f7e,roughness:0.5,transparent:true,opacity:0.85})};
const meshes=[];
for(const p of parts){const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p.mesh.v,3)); g.setIndex(p.mesh.i); g.computeVertexNormals();
 const m=new THREE.Mesh(g,mats[p.mat]); m.userData=p; scene.add(m); meshes.push(m);
 const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,25),new THREE.LineBasicMaterial({color:0x334155,transparent:true,opacity:0.5})); m.add(e);}
let cfg='L110', ex=0;
function apply(){for(const m of meshes){const p=m.userData; m.visible=(p.cfg==='all'||p.cfg===cfg); m.position.set(p.ex[0]*ex,p.ex[1]*ex,p.ex[2]*ex);}}
document.querySelectorAll('[data-cfg]').forEach(b=>b.onclick=()=>{cfg=b.dataset.cfg; document.querySelectorAll('[data-cfg]').forEach(x=>x.classList.toggle('on',x===b)); apply();});
document.getElementById('ex').oninput=e=>{ex=+e.target.value; apply();};
function view(x,y,z){cam.position.set(x,y,z); ctl.update();}
document.getElementById('top').onclick=()=>view(20,0.01,400); document.getElementById('front').onclick=()=>view(20,-350,80); document.getElementById('side').onclick=()=>view(380,0,80); document.getElementById('iso').onclick=()=>view(280,-280,230);
cam.up.set(0,0,1); view(280,-280,230); apply();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop); ctl.update(); ren.render(scene,cam);})();
</script></body></html>
